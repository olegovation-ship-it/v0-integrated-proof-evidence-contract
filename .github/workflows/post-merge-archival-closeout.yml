name: V0 IPEC Post-Merge Archival Closeout

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  post-merge-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/verify_post_merge_archival_closeout.py
      - run: pytest -q tests/test_post_merge_archival_closeout.py
      - run: python scripts/verify_sha256s.py
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: v0-ipec-post-merge-closeout-${{ github.sha }}
          path: |
            evidence/POST_MERGE_HOSTED_CI_EVIDENCE.json
            release/v0.1/POST_MERGE_ARCHIVAL_CLOSEOUT_RECORD.json
            release/v0.1/DEVELOPMENT_BRANCH_SYNCHRONIZATION_RECORD.json
            SHA256SUMS.txt
          if-no-files-found: error
